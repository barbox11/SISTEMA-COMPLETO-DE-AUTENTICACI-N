$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "correo": "{{correo}}",
      "password": "{{passwordTemporal}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.token) { pm.collectionVariables.set('token', json.token); }
    language: text/javascript
order: 2000
